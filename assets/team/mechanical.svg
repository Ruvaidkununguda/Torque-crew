<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140203"/>
      <stop offset="50%" stop-color="#080808"/>
      <stop offset="100%" stop-color="#1f0305"/>
    </linearGradient>
    <linearGradient id="red" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff1722"/>
      <stop offset="100%" stop-color="#b0000a"/>
    </linearGradient>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(255,23,34,0.08)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="400" height="480" fill="url(#bg)"/>
  <rect width="400" height="480" fill="url(#grid)"/>
  <circle cx="200" cy="180" r="110" fill="none" stroke="rgba(255,23,34,0.15)" stroke-width="2" stroke-dasharray="6,6"/>
  <circle cx="200" cy="180" r="85" fill="#111" stroke="url(#red)" stroke-width="3"/>
  <!-- Gear / CAD Icon -->
  <g transform="translate(200, 180)">
    <circle r="40" fill="#181818" stroke="#ff1722" stroke-width="3"/>
    <circle r="18" fill="#090909" stroke="#ff1722" stroke-width="2"/>
    <path d="M -8 -50 L 8 -50 L 6 -38 L -6 -38 Z M -8 50 L 8 50 L 6 38 L -6 38 Z M -50 -8 L -50 8 L -38 6 L -38 -6 Z M 50 -8 L 50 8 L 38 6 L 38 -6 Z M -35 -35 L -25 -45 L -17 -34 L -26 -26 Z M 35 35 L 25 45 L 17 34 L 26 26 Z M -35 35 L -45 25 L -34 17 L -26 26 Z M 35 -35 L 45 -25 L 34 -17 L 26 -26 Z" fill="#ff1722"/>
    <!-- Crossed Wrenches / Calipers -->
    <line x1="-60" y1="70" x2="60" y2="70" stroke="#ff1722" stroke-width="3" stroke-linecap="round"/>
  </g>
  <!-- Tactical Corners -->
  <path d="M 20 50 L 20 20 L 50 20 M 350 20 L 380 20 L 380 50 M 380 430 L 380 460 L 350 460 M 50 460 L 20 460 L 20 430" fill="none" stroke="#ff1722" stroke-width="2"/>
  <text x="200" y="360" fill="#fff" font-family="'Courier New', monospace" font-weight="900" font-size="18" text-anchor="middle" letter-spacing="4">MECHANICAL LEAD</text>
  <text x="200" y="390" fill="#ff1722" font-family="'Courier New', monospace" font-size="12" text-anchor="middle" letter-spacing="3">FABRICATION &amp; CAD</text>
  <text x="200" y="425" fill="#666" font-family="sans-serif" font-size="11" text-anchor="middle">DROP YOUR PHOTO HERE</text>
</svg>
