<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140203"/><stop offset="50%" stop-color="#080808"/><stop offset="100%" stop-color="#1f0305"/>
    </linearGradient>
    <linearGradient id="red" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff1722"/><stop offset="100%" stop-color="#b0000a"/>
    </linearGradient>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(255,23,34,0.08)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="400" height="480" fill="url(#bg)"/>
  <rect width="400" height="480" fill="url(#grid)"/>
  <circle cx="200" cy="180" r="110" fill="none" stroke="rgba(255,23,34,0.15)" stroke-width="2" stroke-dasharray="6,6"/>
  <circle cx="200" cy="180" r="85" fill="#111" stroke="url(#red)" stroke-width="3"/>
  <!-- Notebook / Engineering Documentation Icon -->
  <g transform="translate(200, 180)">
    <rect x="-35" y="-45" width="70" height="90" rx="6" fill="#181818" stroke="#ff1722" stroke-width="3"/>
    <line x1="-20" y1="-25" x2="20" y2="-25" stroke="#ff1722" stroke-width="3" stroke-linecap="round"/>
    <line x1="-20" y1="-5" x2="20" y2="-5" stroke="#ff1722" stroke-width="3" stroke-linecap="round"/>
    <line x1="-20" y1="15" x2="10" y2="15" stroke="#ff1722" stroke-width="3" stroke-linecap="round"/>
    <polygon points="12,18 24,30 20,33 8,21" fill="#ff1722"/>
  </g>
  <path d="M 20 50 L 20 20 L 50 20 M 350 20 L 380 20 L 380 50 M 380 430 L 380 460 L 350 460 M 50 460 L 20 460 L 20 430" fill="none" stroke="#ff1722" stroke-width="2"/>
  <text x="200" y="360" fill="#fff" font-family="'Courier New', monospace" font-weight="900" font-size="18" text-anchor="middle" letter-spacing="3">QUAID</text>
  <text x="200" y="390" fill="#ff1722" font-family="'Courier New', monospace" font-size="12" text-anchor="middle" letter-spacing="3">DOCUMENTATION HEAD // TC-07</text>
  <text x="200" y="425" fill="#666" font-family="sans-serif" font-size="11" text-anchor="middle">DROP YOUR PHOTO HERE</text>
</svg>
