<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140203"/>
      <stop offset="50%" stop-color="#080808"/>
      <stop offset="100%" stop-color="#1f0305"/>
    </linearGradient>
    <linearGradient id="red" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff1722"/>
      <stop offset="100%" stop-color="#b0000a"/>
    </linearGradient>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(255,23,34,0.08)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="400" height="480" fill="url(#bg)"/>
  <rect width="400" height="480" fill="url(#grid)"/>
  <circle cx="200" cy="180" r="110" fill="none" stroke="rgba(255,23,34,0.15)" stroke-width="2" stroke-dasharray="6,6"/>
  <circle cx="200" cy="180" r="85" fill="#111" stroke="url(#red)" stroke-width="3"/>
  <!-- Pilot / Captain Icon -->
  <path d="M 200 130 C 180 130 165 145 165 165 C 165 180 175 195 190 200 C 150 215 130 240 120 280 L 280 280 C 270 240 250 215 210 200 C 225 195 235 180 235 165 C 235 145 220 130 200 130 Z" fill="#222" stroke="#ff1722" stroke-width="2.5"/>
  <!-- Visor / HUD -->
  <path d="M 180 160 Q 200 170 220 160" fill="none" stroke="#ff1722" stroke-width="4" stroke-linecap="round"/>
  <!-- Crown / Star Badge -->
  <polygon points="200,90 205,103 218,103 207,112 211,125 200,117 189,125 193,112 182,103 195,103" fill="#ff1722"/>
  <!-- Tactical Corners -->
  <path d="M 20 50 L 20 20 L 50 20 M 350 20 L 380 20 L 380 50 M 380 430 L 380 460 L 350 460 M 50 460 L 20 460 L 20 430" fill="none" stroke="#ff1722" stroke-width="2"/>
  <text x="200" y="360" fill="#fff" font-family="'Courier New', monospace" font-weight="900" font-size="18" text-anchor="middle" letter-spacing="4">TEAM CAPTAIN</text>
  <text x="200" y="390" fill="#ff1722" font-family="'Courier New', monospace" font-size="12" text-anchor="middle" letter-spacing="3">SYSTEMS &amp; LEADERSHIP</text>
  <text x="200" y="425" fill="#666" font-family="sans-serif" font-size="11" text-anchor="middle">DROP YOUR PHOTO HERE</text>
</svg>
